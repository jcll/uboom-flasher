[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uboom-flasher"
dynamic = ["version"]
description = "Back up, update and restore EarFun UBoom L speaker firmware over USB, without Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.2",
    "libusb-package>=1.0.26",
]
keywords = ["earfun", "uboom", "actions", "ats2833", "adfu", "firmware", "macos"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
uboom-flasher = "uboom_flasher.cli:main"

[tool.setuptools.dynamic]
version = { attr = "uboom_flasher.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
